# Every pull request: format, validate and lint every example, then run them
# all against the fake API with Terraform and OpenTofu, and the Pulumi example
# with Pulumi. Needs no key.
name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      provider_ref:
        description: Branch, tag or commit of terraform-provider-plotwork to build
        default: main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  PROVIDER_REF: ${{ inputs.provider_ref || 'main' }}

jobs:
  static:
    name: Format, validate and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: plotwork-official/terraform-provider-plotwork
          ref: ${{ env.PROVIDER_REF }}
          path: .provider
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .provider/go.mod
          cache-dependency-path: .provider/go.sum
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: make fmt-check
      - run: make validate PROVIDER_DIR="$GITHUB_WORKSPACE/.provider"
      - run: make lint
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads its ruleset from GitHub
      - name: shellcheck
        run: shellcheck -x -P . tests/smoke/run-smoke.sh tests/denials/run-denials.sh tests/lib/*.sh

  smoke-fake:
    name: "Smoke (fake API): ${{ matrix.cli }}"
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cli: [terraform, tofu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: plotwork-official/terraform-provider-plotwork
          ref: ${{ env.PROVIDER_REF }}
          path: .provider
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .provider/go.mod
          cache-dependency-path: .provider/go.sum
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - name: Run every example against the fake API
        run: tests/smoke/run-smoke.sh fake
        env:
          TF_BIN: ${{ matrix.cli }}
          PLOTWORK_ORG: smoke-org
          PLOTWORK_PROVIDER_SOURCE_DIR: ${{ github.workspace }}/.provider
      - name: Check the Free plan's refusals against the fake API
        run: tests/denials/run-denials.sh fake
        env:
          TF_BIN: ${{ matrix.cli }}
          PLOTWORK_PROVIDER_SOURCE_DIR: ${{ github.workspace }}/.provider

  # The Pulumi example, with the registry provider Pulumi.yaml pins (a source
  # build cannot be bridged), a local state backend and the fake API. Needs no key.
  pulumi-fake:
    name: "Pulumi (fake API): typecheck and up"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PULUMI_VERSION: 3.272.0
      PULUMI_SHA256: 58d545f2b98761051922008ebd381ecef95484d7f7a5ff7faa15d7a780ea84f6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the Pulumi CLI
        run: |
          archive="pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/pulumi/pulumi/releases/download/v${PULUMI_VERSION}/$archive"
          echo "$PULUMI_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pulumi" >> "$GITHUB_PATH"
      - name: shellcheck
        run: shellcheck -x -P . tests/pulumi/run-pulumi.sh
      - name: Run the Pulumi example against the fake API
        run: tests/pulumi/run-pulumi.sh fake
