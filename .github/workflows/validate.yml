# Every pull request: format, validate and lint every example, then run them
# all against the fake API with Terraform and OpenTofu. Needs no key.
name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      provider_ref:
        description: Branch, tag or commit of terraform-provider-plotwork to build
        default: main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  PROVIDER_REF: ${{ inputs.provider_ref || 'main' }}

jobs:
  static:
    name: Format, validate and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: plotwork-official/terraform-provider-plotwork
          ref: ${{ env.PROVIDER_REF }}
          path: .provider
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .provider/go.mod
          cache-dependency-path: .provider/go.sum
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: make fmt-check
      - run: make validate PROVIDER_DIR="$GITHUB_WORKSPACE/.provider"
      - run: make lint
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads its ruleset from GitHub
      - name: shellcheck
        run: shellcheck -x -P . tests/smoke/run-smoke.sh tests/lib/*.sh

  smoke-fake:
    name: "Smoke (fake API): ${{ matrix.cli }}"
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cli: [terraform, tofu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: plotwork-official/terraform-provider-plotwork
          ref: ${{ env.PROVIDER_REF }}
          path: .provider
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .provider/go.mod
          cache-dependency-path: .provider/go.sum
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - name: Run every example against the fake API
        run: tests/smoke/run-smoke.sh fake
        env:
          TF_BIN: ${{ matrix.cli }}
          PLOTWORK_ORG: smoke-org
          PLOTWORK_PROVIDER_SOURCE_DIR: ${{ github.workspace }}/.provider
